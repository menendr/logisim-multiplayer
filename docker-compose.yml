services:
  collaboration:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      BIND_ADDRESS: "0.0.0.0"
      DATA_DIR: /app/data
      SHARED_PROJECT_KEY: ${SHARED_PROJECT_KEY:-}
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
